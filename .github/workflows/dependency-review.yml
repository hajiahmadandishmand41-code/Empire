name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # GitHub's dependency-review-action requires the repository Dependency
      # Graph to be enabled and currently emits a Node.js 20 deprecation warning.
      # Use npm's native audit against the committed lockfile instead so this
      # security gate works without repository-level Dependency Graph settings.
      - name: Audit production and development dependencies
        run: npm audit --audit-level=high
