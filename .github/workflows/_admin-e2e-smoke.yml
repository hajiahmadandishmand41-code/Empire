name: Admin E2E smoke

on:
  push:
    branches: [admin-commerce-4stage-20260829]

permissions:
  contents: read

jobs:
  admin-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-admin-e2e-secret-should-never-be-used-in-production
      NEXTAUTH_SECRET: ci-admin-e2e-secret-should-never-be-used-in-production
      SESSION_SECRET: ci-admin-e2e-secret-should-never-be-used-in-production
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NODE_ENV: development
      ADMIN_SEED_PASSWORD: ci-admin-password-12345
      SKIP_DB_MIGRATE: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
      CLOUDINARY_CLOUD_NAME: ci
      CLOUDINARY_API_KEY: ci
      CLOUDINARY_API_SECRET: ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run db:deploy
      - run: npx tsx scripts/seed-admin.ts
      - run: npm run build
      - name: Start app
        run: |
          nohup node .next/standalone/server.js > "$RUNNER_TEMP/empire-admin.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/empire-admin.pid"
          node - <<'NODE'
          const deadline = Date.now() + 120000;
          const url = 'http://127.0.0.1:3000/api/healthz';
          while (Date.now() < deadline) {
            try {
              const r = await fetch(url);
              if (r.ok) process.exit(0);
            } catch {}
            await new Promise(r => setTimeout(r, 1000));
          }
          console.error(require('fs').readFileSync(process.env.RUNNER_TEMP + '/empire-admin.log', 'utf8'));
          process.exit(1);
          NODE
        env:
          HOSTNAME: 0.0.0.0
          PORT: 3000
      - name: Login and verify Admin routes
        run: |
          node --input-type=module <<'NODE'
          const base = 'http://127.0.0.1:3000';
          const login = await fetch(`${base}/api/auth/login`, {
            method: 'POST',
            headers: {'content-type': 'application/json', accept: 'application/json'},
            body: JSON.stringify({identifier: 'admin@empire.shop', password: process.env.ADMIN_SEED_PASSWORD}),
          });
          if (!login.ok) throw new Error(`Admin login failed: ${login.status} ${await login.text()}`);
          const cookie = login.headers.get('set-cookie');
          if (!cookie) throw new Error('Admin login succeeded without session cookie');

          const routes = [
            '/fa/admin',
            '/fa/admin/products',
            '/fa/admin/categories',
            '/fa/admin/orders',
            '/fa/admin/sellers',
            '/fa/admin/users',
            '/fa/admin/shipping-methods',
            '/fa/admin/payments',
            '/fa/admin/payouts',
            '/fa/admin/reports',
            '/fa/admin/reviews',
            '/fa/admin/media',
            '/fa/admin/banners',
            '/fa/admin/marketplace',
            '/fa/admin/analytics',
            '/fa/admin/audit',
            '/fa/admin/notifications',
            '/fa/admin/roles',
            '/fa/admin/search',
          ];

          let failures = 0;
          for (const path of routes) {
            const r = await fetch(`${base}${path}`, {redirect: 'manual', headers: {cookie}});
            const body = await r.text();
            const bad = r.status >= 500 || body.includes('Application error') || body.includes('Internal Server Error') || body.includes('NEXT_HTTP_ERROR_FALLBACK');
            console.log(`${bad ? 'FAIL' : 'PASS'} ${r.status} ${path}`);
            if (bad) {
              failures++;
              console.log(body.slice(0, 1200));
            }
          }
          if (failures) process.exit(1);
          console.log(`Admin authenticated route smoke passed: ${routes.length} routes`);
          NODE
      - name: Upload app log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-e2e-log
          path: ${{ runner.temp }}/empire-admin.log
          if-no-files-found: ignore
