name: Cleanup unused ESLint directives
on:
  push:
    branches: [fix/typescript-complete-audit]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only unused eslint disable directives reported by CI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          rules = {
              'src/app/[locale]/error.tsx': 'no-console',
              'src/app/[locale]/search/page.tsx': 'react-hooks/exhaustive-deps',
              'src/app/[locale]/store/[id]/page.tsx': '@next/next/no-img-element',
              'src/features/home/components/mobile-menu.tsx': 'react-hooks/exhaustive-deps',
              'src/features/seller/components/product-images-editor.tsx': '@next/next/no-img-element',
              'src/features/shop/components/shop-page-client.tsx': 'react-hooks/exhaustive-deps',
              'src/features/wishlist/components/wishlist-page-view.tsx': 'react-hooks/exhaustive-deps',
              'src/lib/api/rate-limit.ts': 'no-console',
              'src/lib/auth/mock-users.ts': 'no-var',
              'src/lib/logger.ts': 'no-console',
          }
          for name, rule in rules.items():
              p = Path(name)
              text = p.read_text()
              pattern = rf'^[ \t]*(?:\{{[ \t]*)?(?://|/\*) eslint-disable-next-line {re.escape(rule)}(?: \*/)?[ \t]*(?:\}})?[ \t]*\n'
              updated, count = re.subn(pattern, '', text, flags=re.MULTILINE)
              if count == 0:
                  raise SystemExit(f'Expected unused directive not found in {name}: {rule}')
              p.write_text(updated)
          PY
          rm .github/workflows/cleanup-unused-eslint-disables.yml .ci-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(lint): remove unused eslint disable directives"
          git push origin HEAD:fix/typescript-complete-audit
