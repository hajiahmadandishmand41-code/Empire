name: Portable production gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-production-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run host:check
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://placeholder.invalid/empire
          AUTH_SECRET: github-ci-placeholder-secret-should-not-be-used-at-runtime
          NEXT_PUBLIC_SITE_URL: https://example.com
          CLOUDINARY_CLOUD_NAME: ci
          CLOUDINARY_API_KEY: ci
          CLOUDINARY_API_SECRET: ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run audit:prod
      - run: npm run build

  container:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: docker build --tag empire:ci .
      - run: docker image inspect empire:ci >/dev/null
