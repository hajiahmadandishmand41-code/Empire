name: CI

on:
  push:
    branches: [main, admin-commerce-4stage-20260829, feature/eshop-marketplace-upgrade, chore/stage-1-architecture-audit-20260826]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  NEXT_TELEMETRY_DISABLED: '1'
  PRISMA_HIDE_UPDATE_MESSAGE: '1'
  AUTH_SECRET: ci-only-not-for-production
  NEXTAUTH_SECRET: ci-only-not-for-production
  SESSION_SECRET: ci-only-not-for-production
  NEXT_PUBLIC_SITE_URL: https://ci.example.test

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Show runtime versions
        run: node --version && npm --version
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Architecture contract
        run: npm run architecture:check
      - name: Six-stage remediation contract
        run: npm run remediation:check
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply Prisma migrations to CI Postgres
        run: npm run db:deploy
      - name: Tests
        run: npm run test
      - name: Production dependency audit
        run: npm run audit:prod -- --audit-level=high
      - name: Production build
        run: npm run build
      - name: Release readiness checks
        run: npm run release-check
