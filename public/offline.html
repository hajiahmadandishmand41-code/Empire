<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>آفلاین · ایشاپ</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: system-ui, -apple-system, "Vazirmatn", "Segoe UI", Roboto, sans-serif;
        background: #0b0d12;
        color: #fff;
        display: grid; place-items: center; text-align: center;
        padding: 2rem;
      }
      .card {
        width: min(100%, 28rem);
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.10);
        border-radius: 1.5rem;
        padding: 2rem 1.5rem;
      }
      .logo { width: 64px; height: 64px; margin: 0 auto 1rem; border-radius: 18px; display:grid; place-items:center; background:#c8174d; box-shadow:0 12px 40px rgba(200,23,77,.28); }
      .logo img { width: 44px; height: 44px; object-fit: contain; }
      h1 { font-size: 1.5rem; margin: .25rem 0 .5rem; }
      p { opacity: .82; line-height: 1.8; margin: .5rem 0 1.25rem; }
      button { background: #c8174d; color: #fff; border: 0; padding: .8rem 1.25rem; border-radius: .8rem; font-weight: 700; cursor: pointer; font-size: 1rem; }
      a { color: #f3b1c7; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo"><img src="/icons/icon-192.png" alt="ایشاپ" /></div>
      <h1>ارتباط اینترنت برقرار نیست</h1>
      <p>شما اکنون آفلاین هستید. برخی صفحات ذخیره‌شده همچنان در دسترس‌اند. اتصال خود را بررسی کنید و دوباره تلاش نمایید.</p>
      <button onclick="location.reload()">تلاش دوباره</button>
      <p style="margin-top:1rem"><a href="/">بازگشت به ایشاپ</a></p>
    </main>
  </body>
</html>
